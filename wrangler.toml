name = "dragica-prso"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
workers_dev = true

[[routes]]
pattern = "dragicaprso.hr"
custom_domain = true

[[routes]]
pattern = "www.dragicaprso.hr"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "dragica-prso-images"

# Secrets set via: wrangler secret put <KEY>
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN
# RESEND_API_KEY, RESEND_AUDIENCE_ID, RESEND_FROM
# NEXTAUTH_SECRET, NEXTAUTH_URL
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ADMIN_EMAILS
# GEMINI_API_KEY, GEMINI_MODEL
# R2_PUBLIC_URL, TURNSTILE_SECRET_KEY
